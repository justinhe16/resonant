# Copy to ~/.resonant/config.yaml (scripts/bootstrap.sh does this for you).
# Non-secret settings only. Secrets live in the macOS Keychain.
timezone: America/Los_Angeles
dry_run: true            # gate logs side effects instead of executing them

model:
  base_url: http://127.0.0.1:11434/v1   # Ollama (OpenAI-compatible)
  name: qwen3:30b-a3b-instruct-2507-q4_K_M   # non-thinking; NOT qwen3:30b-a3b (thinking-only)
  context_tokens: 32768                 # pinned server-side via OLLAMA_CONTEXT_LENGTH
  api: ollama                           # ollama (native /api/chat, think:false) | openai (/v1)

api:
  host: 127.0.0.1                       # loopback only; remote status: the push-only status relay below
  port: 7777

health:
  healthchecks_url: null                # optional dead-man URL (GET while healthy, POST <url>/fail); the relay below is the dead-man switch
  ping_every_s: 60
  watchdog_stale_s: 120

relay:                                  # status relay to Supabase (docs/dashboard-plan.md D4; supabase/README.md)
  enabled: false                        # pushes the remote-tier snapshot only; keeps pushing while /kill-paused
  supabase_url: null                    # https://<ref>.supabase.co
  anon_key: null                        # the project's anon/publishable key (public); the write token is Keychain relay/supabase_key
  every_s: 60

loop:
  tick_s: 30

claude:
  max_concurrent: 5
  reserved_oncall_slots: 1

channels:
  imessage:
    # Resonant's own Apple ID (email handle, iMessage only, no phone number).
    self_handle: resonant@example.com
    # Inbound reader (needs Full Disk Access for the daemon's Python interpreter).
    enabled: false
    db_path: ~/Library/Messages/chat.db   # opened read-only, never written
    poll_s: 2.0                           # fallback poll; chat.db-wal changes trigger reads
    inbound_per_minute: 120               # per principal; excess is dropped and audited
    max_body_chars: 4000                  # longer messages are truncated

power:
  keep_awake: true                      # resonant daemon install adds a caffeinate LaunchAgent (no system sleep)

gate:
  approval_ttl_s: 1800                  # an approval prompt stays answerable this long (60..86400)

trust:
  cost_ask_over_usd: 20.0               # a worker check costing more than this asks you; at or under, cost alone doesn't

# ops:
#   repo_path: ~/resonant               # repo /update pulls into; default: the checkout Resonant runs from
#   uv_path: /opt/homebrew/bin/uv       # absolute path to uv for /update; unset means /update refuses

# Phase 3. Every key has a default; the values below are the defaults.
extensions:
  max_concurrent_jobs: 4                # L0 jobs running at once (1..16)
  result_max_bytes: 32768               # a tool or job result is stored (redacted) up to this
  model_result_max_chars: 4096          # the model sees this much of it, as untrusted data
  process:
    # An extension process's whole PATH. System dirs only: Claude workers can write
    # /opt/homebrew/bin. gh and git are pinned by absolute path at install (argv[0], or a
    # manifest's `bins` such as the github extension's gh), so they don't need it.
    path: [/usr/bin, /bin]
    stdout_max_bytes: 262144            # past this the process tree is killed
    stderr_max_bytes: 8192              # kept redacted, never shown
    kill_grace_s: 2                     # SIGTERM, then SIGKILL after this
    tree_sample_s: 2                    # how often child processes are tracked
    health_timeout_s: 20                # a manifest health check's timeout
  notify:
    max_per_hour: 20                    # per extension; the rest collapse into "+N more updates"
    max_chars: 300                      # notification text is clipped to this

secrets:
  security_path: /usr/bin/security      # Keychain items trust this binary (no prompt)
  timeout_s: 5

briefing:
  enabled: true                         # the daily briefing to the owner (core/briefing)
  at: "08:00"                           # local time in `timezone`, 24-hour HH:MM

pulse:
  enabled: true                         # hourly "btw" messages and urgent interrupts
  quiet_hours: "00:00-06:00"            # local time in `timezone`; only urgent items go out inside it
  remention_after: 10m                  # a pending approval is mentioned once more after this (capped at half gate.approval_ttl_s)

# The brain's read tools (docs/brain-plan.md D5; read_file, list_dir, search, tail_log,
# read_transcript). Defaults shown commented out:
# brain:
#   read_roots: null                    # null: runner.code_dir, ~/resonant, ops.repo_path and
#                                       #   Resonant's logs, docs and run transcripts; a list replaces them
#   read_deny: []                       # added to the built-in deny list (~/Documents, ~/Library, ~/.ssh,
#                                       #   ~/.aws, .env*, *.pem, *.key, id_*, credentials, .git/config, ...);
#                                       #   "/abs" or "~/x" is a path, anything else a glob ("*.secret")
#   rg_path: /opt/homebrew/bin/rg       # ripgrep for search; missing: a bounded Python search

# Claude workers (docs/employee-plan.md, go-live step 14). Every key has a default except
# github_app, which runs need (Claude adds it when you give it the IDs). Defaults shown;
# github_app and repos are examples:
# runner:
#   guard: off                          # off: workers run like you (real HOME, your ~/.claude and claude
#                                       #   login, no sandbox); thin: the Seatbelt thin guard (needs a token)
#   remote_control: on                  # each worker opens a Remote Control session you can watch and steer
#                                       #   in the Claude app (needs your claude login; off: don't ask)
#   github_app: {app_id: 123456, installation_id: 12345678}   # public IDs; key: Keychain runner/github_app_key
#   code_dir: ~/code                    # checkouts; worktrees in .worktrees/<name>/R<n>, scratch in .scratch/R<n>
#   work_dir: ~/resonant-runs           # run dirs (the session's tmp, credentials; its home under thin)
#   cache_dir: ~/resonant-runs/.cache   # package caches shared between runs
#   mirror_dir: ~/.resonant/runner/mirrors   # daemon-only bare mirrors the pre-merge checks read
#   secrets_dir: ~/.resonant/run-secrets     # per-call token files, daemon-only
#   deny_read: []                       # thin only: extra paths a worker may neither read nor write
#   max_minutes: 45                     # session time limit (1..600)
#   max_budget_usd: null                # per-run cap; set it with runner/anthropic_key (API billing)
#   ask_timeout_minutes: 240            # how long a worker's ask or check waits for you
#   keep_days: 7                        # finished run dirs and worktrees are deleted after this
#   max_run_dir_mb: 5000
#   max_cache_gb: 20
#   git_path: /usr/bin/git
#   gh_path: /opt/homebrew/bin/gh
#   repos:                              # optional overrides; repos register on first use, and
#                                       # Resonant's own checkout (ops.repo_path) is "resonant"
#     dori:
#       remote: github.com/you/dori
#       base: main
#       path: ~/work/dori               # checkout elsewhere than <code_dir>/dori
#       allow_github_changes: false     # refuses .github/ changes (unset keeps the default: on)
#       quote_ask: true                 # quote your ask in the PR body (unset keeps the default)
