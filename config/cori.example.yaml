# Cori: a second Resonant instance on the same Mac user (Phase 8, PER-297).
# Copy to ~/.resonant-cori/config.yaml, then target it with `resonant --instance cori ...`
# or RESONANT_INSTANCE=cori. Non-secret settings only: Cori's secrets live in the login
# Keychain under the service resonant-cori (`resonant --instance cori secret list`).
#
# What the instance name derives (resonant/instance.py; docs/interfaces.md "Instances"):
#   home ~/.resonant-cori, LaunchAgent com.resonant.cori.daemon, Keychain service
#   resonant-cori, runner.work_dir ~/cori/runs, runner.code_dir ~/cori/code,
#   runner.cache_dir ~/cori/runs/.cache. Set any of these explicitly only to move it.
# Anything not set here takes the same default as personal Resonant (config/resonant.example.yaml).

instance:
  name: cori
  display_name: Cori

timezone: America/Los_Angeles
dry_run: false

api:
  host: 127.0.0.1
  port: 7778                            # personal Resonant has 7777; install refuses a bound port

claude:
  max_concurrent: 5
  reserved_oncall_slots: 1

channels:
  imessage:
    enabled: false                      # Cori talks in Slack (PER-292, PER-295), never iMessage
  # PER-295: the Slack adapter (Socket Mode: no public port). Turn on at go-live (PER-311), after
  # the owner sets both tokens in Cori's Keychain (values never go in this file):
  #   resonant --instance cori secret set slack/bot_token   (xoxb-…)
  #   resonant --instance cori secret set slack/app_token   (xapp-…, connections:write)
  slack:
    enabled: false
    team_id: T00000000                  # the DORI workspace (events from any other team are dropped)
    bot_user_id: U00000000              # Cori's bot user (auth.test must answer both)
    rooms: {}                           # post_room keys -> channel ids, e.g. {digest: C0123, pulse: C0456}
    follow_idle_days: 14                # a tagged thread is followed until idle this long
    # link_base: https://resonant-relay-jhe.fly.dev   # run codes link to <link_base>#/runs/R12

# PER-299: channel watchers ("@cori whenever someone posts a bug in #support, triage it").
# Added in Slack by an approver (add_job with a channel); invite @Cori to the channel first.
# The Slack app needs the channels:read/groups:read scopes and the message.channels/
# message.groups events (channels:history/groups:history) to see untagged channel messages.
# watchers:
#   max_per_hour: 20                    # runs per watcher an hour; the next match pauses it
#   ask_timeout_s: 20                   # the optional `ask` filter's local-model yes/no

# PER-303: the hourly alive line to #voyager-pulse ("✓ Cori up · healthy · idle"). Turn on at
# go-live with channels.slack (rooms: {pulse: C…} above). Absence is the Fly checker's (PER-305).
# pulse:
#   heartbeat:
#     room: pulse                       # a channels.slack.rooms key; null (default) is off
#     quiet_hours: false                # true: skip pulse.quiet_hours like the owner pulse

# PER-323: a run's milestone lines (PR opened, CI failed and being fixed, review asked for
# changes, merged, deployed to staging) in the asking thread, each once, after a minute of work.
# The default with channels.slack on is thread; off posts only the start and final result.
# runs:
#   milestones: thread                  # thread | off

# PER-335: a self-sufficient team instance. With `allow`, a change the brain picks after its turn
# read outside content (a ticket, a Slack message, an extension's result) runs without a prompt
# when it is the owner's or an approver's L2/L3 write: any extension's (a staging deploy, a ticket)
# and, of the built-in tools, only the run tools (start a run, message or cancel it); a run's merge
# too, when its PR is green and clean and nothing in it is flagged. Jobs, watchers, CI workflows,
# repos and restarts still ask. L1 (prod deploys,
# prod data, payments, releases) and pay still ask, with the code, whatever this says; so does
# anything an `ask` trust rule covers, a member's ask, and everything while paused (/kill).
# The trade-off: text the instance reads could steer it into an extension's L2/L3 write (one that
# posts what it read, too) or a run (starting one, or steering one already going), never an L1 one.
# Every such write still posts its line in the thread and is audited (tainted_allowed: true).
# Personal Resonant keeps the default, ask.
gate:
  tainted_writes: allow                 # ask (default) | allow

# PER-290 (two daemons, one checkout): Ollama and keep-awake stay personal Resonant's (Cori
# reads these as false and refuses them true; she uses the owner's Ollama at 127.0.0.1:11434),
# and code deploys come from personal Resonant (Cori's /update, update_resonant and her workers'
# `resonant update` are refused). Her jobs, watchers, trust rules and facts stay hers to change.
power:
  keep_awake: false
model:
  manage: false
ops:
  self_update: false
runner:
  self_repo: false                      # no "resonant" repo for her workers (GD-1)
  # PER-291 (Cori's scope; docs/employee-plan.md CS-1). Workers stay unguarded: these are
  # instructions and credentials, not a wall.
  # Appended to every worker's system prompt (at most 8 KB, read at run start).
  instructions_file: ~/resonant/config/cori/worker-rules.md
  # Her own Claude setup: only her settings.json, the surf skills and their agents; none of
  # the owner's MCP servers, memory or CLAUDE.md. Auth is Cori's runner/claude_token
  # (`claude setup-token`); the owner's stored claude login is never used.
  claude_config_dir: ~/cori/claude
  # Scoped credentials: {VAR: secret-ref} from Cori's Keychain (resonant-cori), put in each
  # worker's env at run start and redacted from transcripts and texts. A missing one doesn't
  # fail the run; its end text names it and the `resonant --instance cori secret set` to run.
  session_env:
    FLY_API_TOKEN: dori/fly_staging_token          # fly prefers it over ~/.fly/config.yml
    VERCEL_TOKEN: dori/vercel_token
    SUPABASE_ACCESS_TOKEN: dori/supabase_staging_token
    PROD_RO_DATABASE_URL: dori/prod_ro_url
    STAGING_DATABASE_URL: dori/staging_url
    APP_STORE_CONNECT_API_KEY_ID: dori/asc_key_id  # fastlane: build, TestFlight, submit
    APP_STORE_CONNECT_API_ISSUER_ID: dori/asc_issuer
    APP_STORE_CONNECT_API_KEY_CONTENT: dori/asc_key

# PER-314: the daily credential probes find the Vercel and Supabase tokens by their env var;
# a Fly token needs the app it may read (`resonant --instance cori secret probe` checks now).
# secrets:
#   probes:
#     dori/fly_staging_token: {kind: fly, app: <the DORI staging Fly app>}

# PER-291: the Claude brain's rules and a read scope with nothing personal in it. read_file,
# list_dir, search, ask_claude and the brain's shell reads all follow it; a read outside is
# refused, never asked. A non-default instance's read_roots may not overlap another
# instance's home or worker dirs (config validation).
brain:
  instructions_file: ~/resonant/config/cori/brain-rules.md
  # PER-340: a reply the guard still doubts after its one redo goes out as Claude wrote it
  # (flagged on the span), never "I didn't save that; nothing changed." in a team thread.
  # Tool-call text is still never sent. Personal Resonant keeps the default, strict.
  reply_guard: lenient                  # strict (default) | lenient
  read_roots: [~/cori/code, ~/.resonant-cori/logs]
  read_deny: [~/code, ~/resonant, ~/.resonant, ~/trade-jev, ~/Documents, ~/Library, ~/.ssh,
              ~/.config, ~/.fly]

# PER-301: forward every urgent item to personal Resonant, which texts the owner over iMessage
# ([Cori] 🔴 ...). The token is the same value in two Keychains, set by the owner:
#   resonant --instance cori secret set core/notify_token    (here)
#   resonant secret set core/notify_token_cori               (personal Resonant)
# then `resonant --instance cori notify-owner test`.
notify_owner:
  url: http://127.0.0.1:7777            # personal Resonant's loopback API
  token_ref: core/notify_token
