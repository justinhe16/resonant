# Copy to ~/.resonant/principals.yaml. Maps channel identities to people.
# Identity grants permissions; message content never does.
principals:
  owner:
    role: owner                         # everything, incl. kill switch + global settings
    # Every handle you might text from: phone number and Apple ID email.
    identities: ["imessage:+15550000000", "imessage:owner@icloud.com", "slack:U00000000"]
  cofounder:
    identities: ["slack:U11111111"]
    grants:
      example: [request, approve]       # per-extension: request and/or approve
  # PER-293 (Cori): an approver requests and approves everything, never admin.
  # bob:
  #   role: approver
  #   identities: ["slack:U22222222"]
  # A per-tool grant: these tools only (members may file tickets but not deploy).
  # carol:
  #   identities: ["slack:U33333333"]
  #   grants:
  #     dori: {request: [file_ticket, find_tickets, staging_status]}
# Optional (Slack only, never iMessage): anyone else in the workspace is a member with these
# grants. Never an approver.
# default: {channel: slack, grants: {dori: {request: [file_ticket, find_tickets, staging_status]}}}
