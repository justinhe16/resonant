[project]
name = "resonant-sdk"
version = "0.1.0"
description = "SDK for Resonant extensions: manifest schema, tools, events."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resonant_sdk"]
