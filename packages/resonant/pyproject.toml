[project]
name = "resonant"
version = "0.1.0"
description = "Always-on personal agent harness: event loop, approval gate, extensions."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "psutil>=6.0",
    "pydantic>=2.9",
    "pydantic-settings[yaml]>=2.6",
    "pyyaml>=6.0",
    "resonant-sdk",
    "structlog>=24.4",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.scripts]
resonant = "resonant.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resonant"]
