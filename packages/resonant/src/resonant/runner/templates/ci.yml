# Starter CI written by Resonant. Runs ./ci.sh when the repo has one.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run ci.sh
        run: |
          if [ -f ./ci.sh ]; then
            sh ./ci.sh
          else
            echo "No ci.sh in this repo yet; add one to run checks here. Passing."
          fi
