# Example extension: the smallest useful resonant.yaml. Copy this to start your own.
# Real extensions live in their own repos and depend only on resonant-sdk.
name: example
version: 1
description: Example extension; tells the time in a timezone and keeps a notes file.
examples:
  - what time is it in tokyo
  - add "buy milk" to the example notes
approvers: [owner]

jobs:
  - id: morning-ping
    schedule: "0 8 * * 1-5"            # cron, evaluated in the daemon timezone unless tz is set
    run: ./cli.py ping
    effect: read                       # jobs default to write (L2, asks); this one only reads
  # Reporters: they call report() (emit.py) and Resonant decides what is news; see README.
  - id: pnl                            # a fake PnL: normal urgency, so it rides the hourly pulse
    schedule: "55 * * * *"
    run: ./cli.py pnl
    effect: read
    level: L0
  - id: incident                       # urgent when the `incident` tool set "failing"
    schedule: "*/5 * * * *"
    run: ./cli.py incident-check
    effect: read
    level: L0

tools:
  get_time:
    description: Current time in a timezone.
    run: ./cli.py time --tz {tz}
    effect: read                       # read, no secrets: always L0 (acts silently)
    args: {tz: string}
  write_note:
    description: Append a line to the example notes file.
    run: ./cli.py note --text {text}
    effect: write                      # write defaults to L2 (asks unless you asked)
    level: L3                          # reversible + tiny blast radius: act, then report
    args: {text: string}

  incident:
    description: Demo urgent report; set the demo incident to failing or resolved.
    run: ./cli.py incident --state {state}
    effect: write                      # writes a file in the data dir; the incident job reports it
    level: L3
    args: {state: string}

# The most urgency its reports may use: urgent means they can text you at any hour.
report: {max_urgency: urgent}
notify: {on: [ping], channel: imessage}
health: {check: ./cli.py health, every: 5m}
