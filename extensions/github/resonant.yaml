# github: pull requests' CI, reviews and diffs, plus three approved writes (rerun, merge, comment).
# Stdlib Python plus the gh CLI. The token (resonant secret set github/token, or minted per call by
# the instance's GitHub App: extensions.secret_sources, PER-336) reaches this extension on fd 4 and
# gh through a private 0600 hosts.yml in a GH_CONFIG_DIR; it is never in any env or argv. A
# read-only token is fine: the writes then fail cleanly. Each tool's github_app block is the reach
# of an App-minted token (one repo, these permissions); a Keychain token ignores it.
name: github
version: 1
description: Your GitHub pull requests; open PRs, CI failures and fixes, review requests.
examples:
  - any of my PRs failing CI?
  - show PR 40 in justinhe16/resonant
  - what's waiting on my review on github
approvers: [owner]
secrets: [token]
bins: [gh]                             # pinned at install, given as RESONANT_BIN_GH (never PATH)

tools:
  prs:
    description: Your open PRs with CI and review state, plus PRs awaiting your review (open only; recent_prs for merged).
    run: python3 cli.py prs
    effect: read                       # reads only: L0
    secrets: [token]
    timeout_s: 60
  recent_prs:
    description: The newest PRs in one repo (owner/name), newest first, open, merged and closed, with their dates.
    run: python3 cli.py recent_prs --repo {repo}
    effect: read
    args: {repo: string}
    secrets: [token]
    timeout_s: 60
  pr:
    description: One pull request (any author, any repo the token sees) with its checks.
    run: python3 cli.py pr --repo {repo} --number {number}
    effect: read
    args: {repo: string, number: integer}
    secrets: [token]
    timeout_s: 60
  pr_diff:
    description: A pull request's changed files with their patches (clipped), for reviewing it.
    run: python3 cli.py pr_diff --repo {repo} --number {number}
    effect: read
    args: {repo: string, number: integer}
    secrets: [token]
    timeout_s: 60
  pr_comments:
    description: >-
      A pull request's reviews (who approved or asked for changes), inline review comments and
      conversation comments, newest last.
    run: python3 cli.py pr_comments --repo {repo} --number {number}
    effect: read
    args: {repo: string, number: integer}
    secrets: [token]
    timeout_s: 60
  rerun_failed:
    description: Re-run the failed CI jobs on a pull request's current head commit.
    run: python3 cli.py rerun_failed --repo {repo} --number {number}
    effect: write
    level: L3                          # reversible and cheap: ask once
    approval_summary: "re-run the failed CI on PR #{number} in {repo}"
    args: {repo: string, number: integer}
    secrets: [token]
    github_app:                        # pr view reads statusCheckRollup: checks and statuses
      repo: repo
      permissions: {actions: write, contents: read, pull_requests: read, checks: read, statuses: read}
    timeout_s: 120
  merge_pr:
    description: >-
      Squash-merge a pull request whose CI is green, only if its head is still head_sha
      (take it from the pr tool). Never bypasses branch protection.
    run: python3 cli.py merge_pr --repo {repo} --number {number} --head-sha {head_sha}
    effect: write
    level: L2                          # runs when you ask for it; otherwise asks a plain yes
    commit: true
    approval_summary: "merge PR #{number} in {repo}{~head_sha}"  # OK to merge PR #121 in …?
    args: {repo: string, number: integer, head_sha: string}
    secrets: [token]
    github_app:
      repo: repo
      permissions: {contents: write, pull_requests: write, checks: read, statuses: read}
    timeout_s: 120
  comment_pr:
    description: Post a comment on a pull request's conversation (any repo the token can write to).
    run: python3 cli.py comment_pr --repo {repo} --number {number} --body={body}
    effect: write
    level: L3                          # a comment is visible but small: act, then report
    approval_summary: "comment on PR #{number} in {repo}"
    approval_detail: body
    args: {repo: string, number: integer, body: string}
    secrets: [token]
    github_app: {repo: repo, permissions: {pull_requests: write}}
    timeout_s: 60

jobs:
  # stateless: the events table's dedupe key is the memory. Its events (CI, reviews, PR
  # activity, merges) never text on their own: Resonant's hourly rollup reads them.
  - id: watch
    schedule: "*/10 * * * *"
    run: python3 cli.py watch
    effect: read
    level: L0
    secrets: [token]
    timeout_s: 300
  - id: digest                         # reports github/summary for the 08:00 briefing
    schedule: "50 7 * * *"
    run: python3 cli.py digest
    effect: read
    level: L0
    secrets: [token]
    timeout_s: 120
    catchup: 1h

# Low: the summary item waits for the 08:00 briefing and never texts on its own.
report: {max_urgency: low}
# No notify: (GH-2). ci_failed, ci_fixed and review_requested used to text right away; now
# the hourly pulse's Workers rollup carries merges, stalls and review requests, and you ask
# for CI on demand ("any of my PRs failing CI?"). A trust rule brings a text back for one
# event: "text me right away when CI fails in resonant" (notify_now, action ci_failed).
health: {check: python3 cli.py health, every: 30m}
